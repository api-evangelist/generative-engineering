name: Generative Engineering
description: 'Generative Engineering (Generative Vision Ltd) is a London-based deep-tech
  startup, founded in 2021, building a platform that generates, tests, and simulates
  thousands of engineering designs in parallel, in a fraction of the time traditional
  processes take. A code-first integration framework lets engineers plug in their
  existing tools alongside out-of-the-box integrations, spanning concept engineering,
  systems integration, and cost engineering. Parallel engineering aims to radically
  cut product development time for real-world products across energy, decarbonization,
  agriculture, and mobility. The company is backed by a pre-seed round led by EQT Ventures
  with participation from Join Capital. It publishes no public developer API, SDKs,
  or developer portal at this time.'
